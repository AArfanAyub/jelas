<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE8" id="metaTheme">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; connect-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'self';">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>JELAS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header class="apphead">
    <div class="brand">
      <span class="logo" id="brandMark"></span>
      <div>
        <h1>Jelas</h1>
        <div class="sub" id="headSub"></div>
      </div>
    </div>
    <div class="headright">
      <button class="iconbtn" id="blurBtn" data-act="set-blur" aria-label="Privacy blur"></button>
      <button class="iconbtn" id="lockBtn" data-act="set-lock" aria-label="Lock"></button>
    </div>
  </header>

  <!-- TODAY -->
  <section id="todayTab" class="tab active"></section>
  <!-- FLOW -->
  <section id="flowTab" class="tab"></section>
  <!-- ADD -->
  <section id="addTab" class="tab"></section>
  <!-- REPORT -->
  <section id="reportTab" class="tab"></section>
  <!-- ME -->
  <section id="meTab" class="tab"></section>
</div>

<nav class="tabbar" id="tabbar"></nav>

<div class="overlay" id="overlay">
  <div class="ov-head">
    <button class="iconbtn" id="ovBack" data-act="ov-back" aria-label="Back"></button>
    <h2 id="ovTitle"></h2>
    <button class="iconbtn" id="ovAction" style="display:none"></button>
  </div>
  <div class="ov-body" id="ovBody"></div>
</div>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheet"><div class="grabber"></div><div id="sheetBody"></div></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- LOCK -->
<div id="lock">
  <div class="lockmark" id="lockMark"></div>
  <h2 id="lockTitle"></h2>
  <div class="lock-sub" id="lockSub"></div>
  <div class="dots" id="lockDots"></div>
  <div class="lockerr" id="lockErr"></div>
  <div class="lockpad" id="lockPad"></div>
  <div class="lockfoot" id="lockFoot"></div>
</div>

<!-- ONBOARDING -->
<div id="onb">
  <div class="onb-inner">
    <div class="onb-top" id="onbMarkWrap"></div>
    <div id="onbSteps"></div>
    <div class="dots-row" id="onbDots"></div>
    <div class="onb-foot" id="onbFoot"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/crypto.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/receipts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
